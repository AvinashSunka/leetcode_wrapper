<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Microservice UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-md overflow-hidden">
        
        <!-- Header & Controls -->
        <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <h1 class="text-2xl font-bold text-gray-800">Problem Set</h1>
                <select id="topic-select" class="border-gray-300 rounded-md shadow-sm text-sm p-2 outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="array">Arrays</option>
                    <option value="sliding-window">Sliding Window</option>
                    <option value="binary-search">Binary Search</option>
                    <option value="tree">Trees</option>
                    <option value="dynamic-programming">Dynamic Programming</option>
                </select>
            </div>
            <span id="problem-count" class="text-sm text-gray-500 font-medium">Ready</span>
        </div>

        <!-- Data Table -->
        <div class="overflow-x-auto h-[600px] overflow-y-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50 sticky top-0">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Title</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Difficulty</th>
                    </tr>
                </thead>
                <tbody id="problem-table-body" class="bg-white divide-y divide-gray-200">
                    <!-- Rows injected here -->
                </tbody>
            </table>
        </div>
        
        <!-- Load More Button -->
        <div class="p-4 bg-gray-50 border-t border-gray-200 text-center">
            <button id="load-more-btn" class="hidden px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors">
                Load Next 100 Problems
            </button>
        </div>
    </div>

    <script>
        let currentSkip = 0;
        const LIMIT = 100;
        let totalLoaded = 0;

        const getDifficultyBadge = (levelString) => {
            switch(levelString) {
                case 'Easy': return '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Easy</span>';
                case 'Medium': return '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">Medium</span>';
                case 'Hard': return '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Hard</span>';
                default: return '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">Unknown</span>';
            }
        };

        const fetchProblems = (topic, isAppending = false) => {
            const tableBody = document.getElementById('problem-table-body');
            const countLabel = document.getElementById('problem-count');
            const loadMoreBtn = document.getElementById('load-more-btn');
            
            if (!isAppending) {
                tableBody.innerHTML = `<tr><td colspan="3" class="px-6 py-4 text-center text-blue-500">Fetching from LeetCode...</td></tr>`;
            }
            
            loadMoreBtn.textContent = "Loading...";
            loadMoreBtn.disabled = true;

            // Pass the skip limit in the URL
            fetch(`/api/problems/${topic}?limit=${LIMIT}&skip=${currentSkip}`)
                .then(response => response.json())
                .then(jsonResponse => {
                    if (!jsonResponse.success) throw new Error(jsonResponse.message);

                    const problems = jsonResponse.data;
                    totalLoaded = isAppending ? totalLoaded + problems.length : problems.length;
                    countLabel.textContent = `${totalLoaded} problems loaded`;

                    if (problems.length === 0 && !isAppending) {
                        tableBody.innerHTML = `<tr><td colspan="3" class="px-6 py-4 text-center text-gray-500">No problems found.</td></tr>`;
                        loadMoreBtn.classList.add('hidden');
                        return;
                    }

                    let rowsHtml = '';
                    problems.forEach(p => {
                        rowsHtml += `
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${p.frontendQuestionId}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-blue-600 hover:text-blue-800">
                                    <a href="https://leetcode.com/problems/${p.titleSlug}/" target="_blank">${p.title}</a>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">${getDifficultyBadge(p.difficulty)}</td>
                            </tr>
                        `;
                    });

                    // Append if clicking 'Load More', otherwise replace
                    if (isAppending) {
                        tableBody.insertAdjacentHTML('beforeend', rowsHtml);
                    } else {
                        tableBody.innerHTML = rowsHtml;
                    }

                    // If LeetCode returned less than our limit, we hit the end of the list
                    if (problems.length < LIMIT) {
                        loadMoreBtn.classList.add('hidden');
                    } else {
                        loadMoreBtn.classList.remove('hidden');
                        loadMoreBtn.textContent = "Load Next 100 Problems";
                        loadMoreBtn.disabled = false;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    if (!isAppending) tableBody.innerHTML = `<tr><td colspan="3" class="px-6 py-4 text-center text-red-500">Failed to load problems.</td></tr>`;
                    loadMoreBtn.textContent = "Error - Try Again";
                    loadMoreBtn.disabled = false;
                });
        };

        // When dropdown changes, reset everything to 0 and fetch
        document.getElementById('topic-select').addEventListener('change', (e) => {
            currentSkip = 0;
            totalLoaded = 0;
            fetchProblems(e.target.value, false);
        });

        // When "Load More" is clicked, increase skip by 100 and append
        document.getElementById('load-more-btn').addEventListener('click', () => {
            currentSkip += LIMIT;
            const topic = document.getElementById('topic-select').value;
            fetchProblems(topic, true);
        });

        // Initial load
        fetchProblems(document.getElementById('topic-select').value, false);
    </script>
</body>
</html>
